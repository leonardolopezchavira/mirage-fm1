# The FM-1 firmware (app/, on fm1-base), built with JieLi's toolchain by the shared fm1-build workflow, as sq80-fm1's
# is: every push that touches it builds release app/VERSION (the run's "packages" artifact). A v* tag also makes a
# GitHub release. (The site and web installer come in phase 5.)
name: firmware

on:
  push:
    branches: [main]
    paths: ['app/**', 'src/mirage/**', 'fm1/**', '.gitmodules', '.github/workflows/firmware.yml']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: |
        git submodule update --init --recursive
        python3 fm1/base/tools/build.py app --release "$(cat app/VERSION)"
      packages: app/build/*.fwsc
      test: |
        python3 fm1/base/tools/build.py app --host
        app/build/host/mirage_host app/tests/basic.txt app/build/host
        app/build/host/mirage_host app/tests/safe.txt app/build/host
        app/build/host/mirage_host app/tests/overload.txt app/build/host
      tests-block: false
